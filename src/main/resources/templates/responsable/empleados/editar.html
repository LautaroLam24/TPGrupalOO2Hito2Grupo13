<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar empleado - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/responsable/empleados}">Volver al listado</a>
    </div>
</nav>

<main class="container py-5">
    <div class="mx-auto" style="max-width: 850px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-2">Modificar empleado</h1>
                <p th:if="${unidad != null}" class="mb-2">
                    Unidad de venta: <strong th:text="${unidad.nombreComercial}">Unidad</strong>
                </p>
                <p class="text-muted mb-4">
                    Actualizá los datos del empleado. El tipo y el email no se pueden modificar.
                </p>

                <form th:action="@{/responsable/empleados/{id}/editar(id=${empleadoId})}"
                      th:object="${modificarPersonalForm}" method="post" novalidate>

                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                    </div>

                    <h2 class="h5 mb-3">Datos personales</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input id="nombre" type="text" class="form-control"
                                   th:field="*{nombre}" maxlength="60"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input id="apellido" type="text" class="form-control"
                                   th:field="*{apellido}" maxlength="60"
                                   th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{apellido}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="dni" class="form-label">DNI</label>
                            <input id="dni" type="number" class="form-control"
                                   th:field="*{dni}" min="1" step="1" inputmode="numeric"
                                   th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{dni}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Email (usuario)</label>
                            <input id="email" type="text" class="form-control bg-light"
                                   th:field="*{email}" readonly>
                        </div>

                        <div class="col-md-6">
                            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                            <input id="fechaNacimiento" type="date" class="form-control"
                                   th:field="*{fechaNacimiento}"
                                   th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="fechaIngreso" class="form-label">Fecha de ingreso</label>
                            <input id="fechaIngreso" type="date" class="form-control"
                                   th:field="*{fechaIngreso}"
                                   th:classappend="${#fields.hasErrors('fechaIngreso')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
                        </div>
                    </div>

                    <h2 class="h5 mt-4 mb-3">Datos laborales</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="tipoEmpleado" class="form-label">Tipo de empleado</label>
                            <input id="tipoEmpleado" type="text" class="form-control bg-light"
                                   th:field="*{tipoEmpleado}" readonly>
                        </div>

                        <div class="col-md-6" th:if="*{tipoEmpleado == 'CAJERO'}">
                            <label for="turno" class="form-label">Turno</label>
                            <select id="turno" class="form-select" th:field="*{turno}"
                                    th:classappend="${#fields.hasErrors('turno')} ? 'is-invalid'">
                                <option value="">Seleccionar...</option>
                                <option th:each="t : ${T(com.unla.epicentrogourmet.entities.Turno).values()}"
                                        th:value="${t}" th:text="${t}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{turno}"></div>
                        </div>

                        <div class="col-md-6" th:if="*{tipoEmpleado == 'COCINA'}">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select id="categoria" class="form-select" th:field="*{categoria}"
                                    th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                                <option value="">Seleccionar...</option>
                                <option th:each="c : ${T(com.unla.epicentrogourmet.entities.CategoriaCocina).values()}"
                                        th:value="${c}" th:text="${c}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{categoria}"></div>
                        </div>

                        <div class="col-md-6" th:if="*{tipoEmpleado == 'COCINA'}">
                            <label for="especialidad" class="form-label">Especialidad (opcional)</label>
                            <input id="especialidad" type="text" class="form-control"
                                   th:field="*{especialidad}" maxlength="100"
                                   th:classappend="${#fields.hasErrors('especialidad')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{especialidad}"></div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a class="btn btn-outline-secondary" th:href="@{/responsable/empleados}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
