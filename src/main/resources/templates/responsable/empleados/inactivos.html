<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empleados inactivos - Epicentro Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/index}">Volver al inicio</a>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0">Empleados inactivos</h1>
            <p th:if="${unidad != null}" class="text-muted mb-0">
                Empleados inactivos de <strong th:text="${unidad.nombreComercial}">Unidad</strong>
            </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/responsable/empleados}">Ver activos</a>
    </div>

    <div th:if="${mensajeExito != null}" class="alert alert-success" role="alert"
         th:text="${mensajeExito}"></div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert"
         th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form class="row g-3" method="get" th:action="@{/responsable/empleados/inactivos}">
                <div class="col-md-5">
                    <label for="texto" class="form-label">Nombre, apellido o DNI</label>
                    <input type="text" class="form-control" id="texto" name="texto" th:value="${texto}">
                </div>
                <div class="col-md-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select class="form-select" id="tipo" name="tipo">
                        <option value="" th:selected="${tipo == ''}">Todos</option>
                        <option value="CAJERO" th:selected="${tipo == 'CAJERO'}">Cajeros</option>
                        <option value="COCINA" th:selected="${tipo == 'COCINA'}">Cocina</option>
                    </select>
                </div>
                <div class="col-md-4 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary">Filtrar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/responsable/empleados/inactivos}">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(empleados)}" class="alert alert-info mb-0">
                No hay empleados inactivos que coincidan con el filtro.
            </div>

            <div class="table-responsive" th:unless="${#lists.isEmpty(empleados)}">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>DNI</th>
                        <th>Tipo</th>
                        <th>Detalle</th>
                        <th>Email</th>
                        <th>Ingreso</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="e : ${empleados}">
                        <td th:text="${e.nombreCompleto}"></td>
                        <td th:text="${e.dni}"></td>
                        <td th:text="${e.tipo}"></td>
                        <td th:text="${e.detalle}"></td>
                        <td th:text="${e.email}"></td>
                        <td th:text="${#temporals.format(e.fechaIngreso, 'dd/MM/yyyy')}"></td>
                        <td>
                            <form method="post" th:action="@{/responsable/empleados/{id}/reactivar(id=${e.id})}"
                                  onsubmit="return confirm('¿Reactivar a este empleado? Podrá volver a iniciar sesión.');">
                                <button type="submit" class="btn btn-outline-success btn-sm">Reactivar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</body>
</html>
