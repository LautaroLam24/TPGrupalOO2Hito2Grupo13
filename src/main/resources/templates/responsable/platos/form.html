<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${edicion} ? 'Modificar Plato - Epicentro Gourmet' : 'Nuevo Plato - Epicentro Gourmet'">
        Plato - Epicentro Gourmet
    </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/responsable/platos}">Volver a Platos</a>
    </div>
</nav>

<main class="container py-5">
    <div class="mx-auto" style="max-width: 700px;">
        <div th:if="${error != null}" class="alert alert-danger" role="alert"
             th:text="${error}"></div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-2" th:text="${edicion} ? 'Modificar Plato' : 'Nuevo Plato'">Plato</h1>
                <p class="text-muted mb-4" th:if="${unidad != null}">
                    Unidad administrada: <strong th:text="${unidad}"></strong>
                </p>

                <form th:action="${edicion} ? @{/responsable/platos/{id}(id=${platoId})} : @{/responsable/platos}"
                      th:object="${platoForm}" method="post" novalidate>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <div th:each="errorGlobal : ${#fields.globalErrors()}"
                             th:text="${errorGlobal}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" type="text" class="form-control" th:field="*{nombre}"
                               maxlength="100" autocomplete="off"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="precioVenta" class="form-label">Precio de venta</label>
                            <input id="precioVenta" type="number" class="form-control"
                                   th:field="*{precioVenta}" min="0.01" step="any"
                                   th:classappend="${#fields.hasErrors('precioVenta')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{precioVenta}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="costoProduccion" class="form-label">Costo de producción</label>
                            <input id="costoProduccion" type="number" class="form-control"
                                   th:field="*{costoProduccion}" min="0" step="any"
                                   th:classappend="${#fields.hasErrors('costoProduccion')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{costoProduccion}"></div>
                        </div>
                    </div>

                    <div class="form-text mt-3">
                        El precio de venta debe ser mayor que el costo de producción.
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/responsable/platos}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
