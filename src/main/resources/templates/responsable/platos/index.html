<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platos - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/index}">Volver al inicio</a>
    </div>
</nav>

<main class="container py-5">
    <div class="mx-auto" style="max-width: 1050px;">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1">Platos</h1>
                <p class="text-muted mb-0" th:if="${unidad != null}">
                    Unidad administrada: <strong th:text="${unidad}"></strong>
                </p>
            </div>
            <a class="btn btn-primary" th:if="${unidad != null}"
               th:href="@{/responsable/platos/nuevo}">Nuevo Plato</a>
        </div>

        <div th:if="${mensajeExito != null}" class="alert alert-success" role="alert"
             th:text="${mensajeExito}"></div>
        <div th:if="${error != null}" class="alert alert-danger" role="alert"
             th:text="${error}"></div>

        <div th:if="${platos != null and #lists.isEmpty(platos)}" class="alert alert-info">
            La unidad todavía no tiene Platos registrados.
        </div>

        <div th:if="${platos != null and !#lists.isEmpty(platos)}"
             class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Precio de venta</th>
                        <th>Costo de producción</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="plato : ${platos}" th:classappend="${!plato.activo} ? 'table-secondary'">
                        <td th:text="${plato.nombre}">Nombre</td>
                        <td th:text="' $' + ${#numbers.formatDecimal(plato.precioVenta, 1, 2)}">$0,00</td>
                        <td th:text="' $' + ${#numbers.formatDecimal(plato.costoProduccion, 1, 2)}">$0,00</td>
                        <td>
                            <span th:if="${plato.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${plato.activo}" class="badge bg-secondary">Dado de baja</span>
                        </td>
                        <td class="text-end">
                            <div th:if="${plato.activo}"
                                 class="d-inline-flex flex-wrap justify-content-end gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/responsable/platos/{id}/editar(id=${plato.id})}">Editar</a>
                                <form th:action="@{/responsable/platos/{id}/baja(id=${plato.id})}"
                                      method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        Dar de baja
                                    </button>
                                </form>
                            </div>
                            <span th:unless="${plato.activo}" class="text-muted small">Sin acciones</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/index}">Volver</a>
        </div>
    </div>
</main>
</body>
</html>
