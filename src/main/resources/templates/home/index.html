<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epicentro Gourmet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>

    <a sec:authorize="isAnonymous()" class="btn btn-outline-light btn-sm" th:href="@{/login}">Ingresar</a>

    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
      <span class="text-light" sec:authentication="name"></span>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
      </form>
    </div>
  </div>
</nav>

<main class="container py-5">
  <h1 class="mb-4">Bienvenido a Epicentro Gourmet</h1>
  <div sec:authorize="hasRole('ADMIN')" class="alert alert-info">Ingresaste como Administrador.</div>
  <div sec:authorize="hasRole('RESPONSABLE')" class="alert alert-info">Ingresaste como Responsable.</div>
  <div sec:authorize="hasRole('EMPLEADO')" class="alert alert-info">Ingresaste como Empleado.</div>
</main>
</body>
</html>
