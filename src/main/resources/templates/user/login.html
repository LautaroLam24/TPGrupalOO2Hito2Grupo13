<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm w-100" style="max-width: 400px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-1">Epicentro Gourmet</h3>
            <p class="text-center text-muted mb-4">Iniciá sesión para continuar</p>

            <div th:if="${error != null}" class="alert alert-danger">Usuario o contraseña inválidos.</div>
            <div th:if="${logout != null}" class="alert alert-success">Sesión cerrada correctamente.</div>

            <form th:action="@{/loginprocess}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <p class="text-center mt-3 mb-0"><a th:href="@{/index}">Volver al inicio</a></p>
        </div>
    </div>
</div>
</body>
</html>
