<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis liquidaciones</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a><a class="btn btn-outline-light btn-sm" th:href="@{/index}">Volver al inicio</a></div></nav>
<main class="container py-5"><h1 class="h3">Mis liquidaciones de haberes</h1><p class="text-muted">Acá aparecen las liquidaciones que el responsable ya te envió.</p>
<div th:if="${#lists.isEmpty(liquidaciones)}" class="alert alert-info">Todavía no tenés liquidaciones enviadas.</div>
<div th:unless="${#lists.isEmpty(liquidaciones)}" class="table-responsive"><table class="table table-striped align-middle bg-white"><thead class="table-dark"><tr><th>Período</th><th>Festival</th><th>Días trabajados</th><th>Total</th><th>Enviada</th><th>Documento</th></tr></thead><tbody>
<tr th:each="l : ${liquidaciones}"><td th:text="${l.periodo}"></td><td th:text="${l.festival.nombre}"></td><td th:text="${l.diasTrabajados}"></td><td th:text="${'$ ' + #numbers.formatDecimal(l.sueldoTotal, 1, 2)}"></td><td th:text="${#temporals.format(l.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></td><td class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/empleado/mis-liquidaciones/{id}(id=${l.id})}">Ver detalle</a><a class="btn btn-sm btn-primary" th:href="@{/empleado/mis-liquidaciones/{id}/pdf(id=${l.id})}">Descargar PDF</a></td></tr>
</tbody></table></div></main></body></html>
