<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>¿Trabajo hoy? - Epicentro Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/index}">Volver al inicio</a>
    </div>
</nav>

<main class="container py-5">
    <div class="mx-auto" style="max-width: 700px;">
        <h1 class="h3 mb-4">¿Trabajo hoy?</h1>

        <div th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <div th:if="${actividad != null}">
            <div class="alert"
                 th:classappend="${actividad.trabajaHoy} ? 'alert-success' : (${actividad.tieneUnidad} ? 'alert-secondary' : 'alert-warning')"
                 role="alert" th:text="${actividad.mensaje}"></div>

            <div class="card shadow-sm" th:if="${actividad.unidad != null}">
                <div class="card-body">
                    <p class="mb-1"><strong>Unidad:</strong> <span th:text="${actividad.unidad}"></span></p>
                    <p class="mb-1" th:if="${actividad.festival != null}">
                        <strong th:text="${actividad.trabajaHoy} ? 'Festival en curso:' : 'Próximo festival:'"></strong>
                        <span th:text="${actividad.festival}"></span>
                    </p>
                    <p class="mb-0" th:if="${actividad.fechaInicio != null}">
                        <strong>Fechas:</strong>
                        <span th:text="${#temporals.format(actividad.fechaInicio, 'dd/MM/yyyy')}"></span>
                        al
                        <span th:text="${#temporals.format(actividad.fechaFin, 'dd/MM/yyyy')}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
