<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de pedido - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/index}">Volver al inicio</a>
    </div>
</nav>

<main class="container py-5">
    <div class="mx-auto" style="max-width: 900px;">
        <h1 class="h3 mb-2">Nuevo pedido</h1>
        <p class="text-muted">Ingresá una cantidad solamente para los platos que quieras incluir.</p>

        <div th:if="${mensajeExito != null}" class="alert alert-success" th:text="${mensajeExito}"></div>
        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${unidad != null}" class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <div><strong>Unidad:</strong> <span th:text="${unidad}"></span></div>
                <div><strong>Festival activo:</strong> <span th:text="${festival}"></span></div>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/empleado/pedidos/nuevo}" th:object="${altaPedidoForm}" method="post">
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                        <div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div>
                    </div>

                    <div th:if="${#lists.isEmpty(platos)}" class="alert alert-warning">
                        La unidad no tiene platos activos disponibles.
                    </div>

                    <div th:unless="${#lists.isEmpty(platos)}" class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead class="table-dark">
                            <tr>
                                <th>Plato</th>
                                <th>Precio</th>
                                <th style="width: 190px;">Cantidad</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="plato, estado : ${platos}">
                                <td th:text="${plato.nombre}"></td>
                                <td>$ <span th:text="${#numbers.formatDecimal(plato.precioVenta, 1, 2)}"></span></td>
                                <td>
                                    <input type="hidden"
                                           th:field="*{items[__${estado.index}__].platoId}">
                                    <input type="number"
                                           min="1"
                                           step="1"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('items[' + estado.index + '].cantidad')} ? 'is-invalid'"
                                           th:field="*{items[__${estado.index}__].cantidad}"
                                           placeholder="Sin seleccionar">
                                    <div class="invalid-feedback"
                                         th:errors="*{items[__${estado.index}__].cantidad}"></div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary" th:disabled="${#lists.isEmpty(platos)}">
                            Registrar pedido
                        </button>
                        <a class="btn btn-warning" th:href="@{/empleado/caja/cierre}">Cerrar caja</a>
                        <a class="btn btn-outline-secondary" th:href="@{/index}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
