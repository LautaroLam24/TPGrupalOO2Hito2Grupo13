<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades del festival - Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet · Admin</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="'Unidades de ' + ${festival.nombre}">Unidades del festival</h1>
            <p class="text-muted mb-0"
               th:text="${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')} + ' al ' + ${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')}">
                01/01/2026 al 02/01/2026
            </p>
        </div>
        <a th:href="@{/admin/festivales}" class="btn btn-outline-secondary">Volver al listado</a>
    </div>

    <div th:if="${mensajeExito != null}"
         class="alert alert-success" th:text="${mensajeExito}"></div>

    <div th:if="${#lists.isEmpty(unidades)}" class="alert alert-warning">
        Este festival no tiene unidades de venta asignadas.
    </div>

    <div th:unless="${#lists.isEmpty(unidades)}" class="table-responsive">
        <table class="table table-striped align-middle bg-white">
            <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Nombre comercial</th>
                <th>Tipo</th>
                <th>Responsable</th>
                <th>Superficie (m²)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${unidades}">
                <td th:text="${u.codigo}">ABCD123456</td>
                <td th:text="${u.nombreComercial}">Nombre</td>
                <td th:text="${u.tipo}">Food truck</td>
                <td th:text="${u.responsable.username}">responsable@epicentro.com</td>
                <td th:text="${#numbers.formatDecimal(u.superficieM2, 1, 2)}">10.00</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
