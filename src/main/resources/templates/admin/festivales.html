<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festivales - Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet · Admin</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h1 class="h3 mb-4">Festivales</h1>

    <div th:if="${mensajeError != null}"
         class="alert alert-danger" th:text="${mensajeError}"></div>

    <div th:if="${#lists.isEmpty(festivales)}" class="alert alert-warning">
        No hay festivales cargados.
    </div>

    <div th:unless="${#lists.isEmpty(festivales)}" class="table-responsive">
        <table class="table table-striped align-middle bg-white">
            <thead class="table-dark">
            <tr>
                <th>Festival</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Duración</th>
                <th>Estado</th>
                <th>Unidades</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${festivales}">
                <td th:text="${f.nombre}">Nombre</td>
                <td th:text="${#temporals.format(f.fechaInicio, 'dd/MM/yyyy')}">01/01/2026</td>
                <td th:text="${#temporals.format(f.fechaFin, 'dd/MM/yyyy')}">02/01/2026</td>
                <td th:text="${f.calcularDuracionDias()} + ' días'">1 días</td>
                <td>
                    <span th:if="${f.estaActivo(#temporals.createToday())}" class="badge bg-success">En curso</span>
                    <span th:if="${f.fechaInicio.isAfter(#temporals.createToday())}" class="badge bg-info text-dark">Próximo</span>
                    <span th:if="${f.fechaFin.isBefore(#temporals.createToday())}" class="badge bg-secondary">Finalizado</span>
                </td>
                <td th:text="${#sets.size(f.unidades)}">0</td>
                <td class="text-end">
                    <a th:href="@{/admin/festivales/{id}/unidades(id=${f.id})}"
                       class="btn btn-outline-primary btn-sm">Ver unidades</a>
                    <a th:href="@{/admin/festivales/{id}/ranking(id=${f.id})}"
                       class="btn btn-outline-success btn-sm">Ranking</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
